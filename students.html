<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Students — Student Work Aid Attendance</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container page">

    <section class="page-header">
      <div>
        <p class="eyebrow">Master list</p>
        <h1>Students</h1>
        <p class="sub">
          Keep every student’s name here once, then tick them off each day. Removing a name
          never changes past attendance records.
        </p>
      </div>
    </section>

    <!-- Add a student -->
    <section class="card animate-in" style="margin-bottom: var(--space-6)">
      <form id="add-student-form" class="inline-form" novalidate>
        <input id="new-student-name" class="input" type="text" placeholder="Student full name" autocomplete="off" />
        <button class="btn btn--primary" id="add-student-submit" type="submit">
          <span class="btn__label">Add student</span>
          <span class="btn__spinner"></span>
        </button>
      </form>
    </section>

    <!-- Search + list -->
    <section class="card animate-in delay-1">
      <div class="card__header" style="display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between">
        <div>
          <h2>Master list</h2>
          <p id="students-count">Loading…</p>
        </div>
        <div class="search" style="flex: 1 1 240px; max-width: 320px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" />
          </svg>
          <input id="students-search" class="input" type="text" placeholder="Search students…" autocomplete="off" />
        </div>
      </div>

      <div id="students-loading">
        <div class="skeleton" style="margin-bottom: var(--space-2)"></div>
        <div class="skeleton" style="margin-bottom: var(--space-2)"></div>
        <div class="skeleton"></div>
      </div>

      <!-- List is rendered here by js/students.js -->
      <div id="students-list"></div>
    </section>
  </main>

  <div class="toast-stack" id="toast-stack"></div>

  <script type="module" src="js/students.js"></script>
</body>
</html>
